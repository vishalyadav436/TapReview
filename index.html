<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Google Review...</title>
    <style>
        body {
            background-color: #4285F4; /* Google Blue Background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .loader-container {
            text-align: center;
        }
        .g-logo {
            font-size: 54px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #fff;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 16px;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }
    </style>
    <script>
        // ========================================================
        // 🗂️ SHOP DATABASE (Yahan naye bikne wale cards jodein)
        // ========================================================
        const shopDatabase = {
            "001": "https://share.google/DkTNyeIUymooRGJZQ", // Pehla test card
            "002": "https://goo.gl", // Doosra test card
            "003": "https://goo.gl"  // Teesra test card
            // 💡 Agla card sell hone par upar comma (,) lagakar nayi line jodein:
            // "004": "https://goo.gl",
        };

        // Background logic jo browser load hote hi chalegi
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const cardId = urlParams.get('id');

            // Agar ID database me milti hai toh instant redirect karo
            if (cardId && shopDatabase[cardId]) {
                window.location.replace(shopDatabase[cardId]);
            } else {
                // Agar card active nahi hai toh ye landing text screen par dikhao
                document.body.innerHTML = `
                    <div style="text-align: center; padding: 20px; max-width: 400px;">
                        <h2 style="font-size: 28px; margin-bottom: 10px;">✨ Smart Review Card</h2>
                        <p style="font-size: 18px; opacity: 0.9;">This premium card (ID: ${cardId || 'Unknown'}) is ready for activation.</p>
                        <p style="font-size: 14px; opacity: 0.7; margin-top: 20px;">Contact customer support to link your Google Business Page.</p>
                    </div>
                `;
            }
        });
    </script>
</head>
<body>
    <div class="loader-container">
        <div class="g-logo">G</div>
        <div class="spinner"></div>
        <p>Connecting to Google Review...</p>
    </div>
</body>
</html>
